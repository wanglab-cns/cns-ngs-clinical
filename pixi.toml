[workspace]
authors = ["Farnoosh Abbas Aghababazadeh <farnoosh.abbasaghababazadeh@uhn.ca>"]
channels = ["conda-forge", "bioconda"]
name = "cns-ngs-clinical"
platforms = ["win-64"]
version = "0.1.0"

[tasks]

r = "R"

render-readme = """
Rscript -e "rmarkdown::render('README.Rmd')"
"""

run-clinical = """
Rscript scripts/clinical_os_assoc.R
"""

run-mutation = """
Rscript scripts/mutation_os_assoc.R
"""

run-oncoprint = """
Rscript scripts/oncoprint_visualization.R
"""

run-comutation = """
Rscript scripts/comutation_analysis.R
"""

[dependencies]

r-base = ">=4.4"
r-tidyverse = ">=2.0.0"
r-survival = ">=3.7"
r-survminer = ">=0.5.0"
r-ggplot2 = ">=3.5.0"
r-stringr = ">=1.5.0"
r-tidyr = ">=1.3.0"
r-dplyr = ">=1.1.0"
r-readr = ">=2.1.0"
"r-data.table" = ">=1.15.0"
r-paletteer = ">=1.6.0"
r-coxphf = ">=1.13.4"
r-rmarkdown = ">=2.28"


[tasks.postInstall]
cmd = [
  "Rscript -e \"if (!requireNamespace('BiocManager', quietly = TRUE)) install.packages('BiocManager')\"",
  "Rscript -e \"BiocManager::install('MultiAssayExperiment')\"",
  "Rscript -e \"BiocManager::install('ComplexHeatmap')\"",
  "Rscript -e \"remotes::install_github('bhklab/PredictioR', ref = '46a2708fc7455a4cd064334b3de2407c7c82db73')\""
]
description = "Install Bioconductor and GitHub R packages"
